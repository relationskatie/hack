
services:
  content_service:
    build: ./
    ports:
      - "${AUTH_SERVICE_PORT}:50051"
    env_file:
      - .env
    networks: # ← добавлено
      - app_network          # ← теперь в той же сети
    depends_on:
      postgres_content:
        condition: service_healthy
      minio:
        condition: service_started
  postgres_content:
    image: postgres:15
    container_name: postgres_content
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h postgres_content"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    networks: # ← добавлено
      - app_network          # ← теперь в той же сети

networks:
  app_network:
    driver: bridge