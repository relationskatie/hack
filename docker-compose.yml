
services:

  api-gateway:
    build: ./api-gateway
    ports:
      - "${API_GATEWAY_PORT}:8061"
    env_file:
      - .env
    networks: 
      - app_network 
    depends_on:
      - content_service
      - order_services
      - location_sevices
      - analitic_service
  content_service:
    build: ./content_service
    ports:
      - "${AUTH_SERVICE_PORT}:50051"
    env_file:
      - .env
    networks: 
      - app_network         
    depends_on:
      postgres_content:
        condition: service_healthy
      minio:
        condition: service_started

  postgres_orders:
    image: postgres:15
    container_name: postgres_orders
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: relationskat123
      POSTGRES_PASSWORD: relations123mu
    command: ["postgres", "-p", "5433"]
    ports:
      - "5433:5433"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relationskat123 -d order_db -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  

  postgres_content:
    image: postgres:15
    container_name: postgres_content
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h postgres_content"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    networks: 
      - app_network

  order_services:
    build: ./order-service
    ports: 
      - "${ORDER_SERVICE}:50053"

    env_file:
      - .env
    networks:
      - app_network

    depends_on:
      - postgres_orders

  analitic_postgres:
    image: postgres:15
    container_name: analitic_postgres
    environment:
      POSTGRES_USER: analitic_user
      POSTGRES_PASSWORD: analitic_pass
      POSTGRES_DB: analitic_db
    command: ["postgres", "-p", "5434"]
    ports:
      - "5434:5434"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analitic_user -d analitic_db -h analitic_postgres  -p 5434"]
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - ./src/smolathon_arxiv/analytics_service/migrations:/docker-entrypoint-initdb.d/
    networks:
      - app_network
  analitic_service:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "50052:50052"
    container_name: analitic_service
    depends_on:
      analitic_postgres:
        condition: service_healthy
    networks:
      - app_network

  postgres_location:
    image: postgres:15
    container_name: postgres_location
    environment:
      POSTGRES_USER: relationskat123
      POSTGRES_PASSWORD: relations123mu
      POSTGRES_DB: location_db
    command: ["postgres", "-p", "5435"]
    ports:
      - "5435:5435"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relationskat123 -d location_db -p 5435"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  location_sevices:
    build: ./map-services
    ports:
      - "50054:50054"
    env_file:
      - .env
    networks: 
      - app_network         
    depends_on:
      postgres_location:
        condition: service_healthy




networks:
  app_network:
    driver: bridge