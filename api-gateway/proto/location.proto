syntax = "proto3";

package location;

option go_package = "./proto;location";


service ItemService {
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  rpc UpdateItem(UpdateItemRequest) returns (UpdateItemResponse);
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse);
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);

  rpc CreateTrafficLight(CreateTrafficLightRequest) returns (CreateTrafficLightResponse);
  rpc GetTrafficLight(GetTrafficLightRequest) returns (GetTrafficLightResponse);
  rpc UpdateTrafficLight(UpdateTrafficLightRequest) returns (UpdateTrafficLightResponse);
  rpc DeleteTrafficLight(DeleteTrafficLightRequest) returns (DeleteTrafficLightResponse);
  rpc ListTrafficLights(ListTrafficLightsRequest) returns (ListTrafficLightsResponse);
}


message Item {
  int64 id = 1;
  string title = 2;
  string status = 3;
  string type = 4;
}

message CreateItemRequest {
  string title = 1;
  string status = 2;
  string type = 3;
}

message CreateItemResponse {
  Item item = 1;
}

message GetItemRequest {
  int64 id = 1;
}

message GetItemResponse {
  Item item = 1;
}

message UpdateItemRequest {
  int64 id = 1;
  string title = 2;
  string status = 3;
  string type = 4;
}

message UpdateItemResponse {
  Item item = 1;
}

message DeleteItemRequest {
  int64 id = 1;
}

message DeleteItemResponse {
  bool success = 1;
}

message ListItemsRequest {
}

message ListItemsResponse {
  repeated Item items = 1;
}

// ================== Новый объект TrafficLight (Светофор) ==================

message TrafficLight {
  int64 id = 1;
  string address = 2;
  string type = 3;
  int32 year_installation = 4;
}

message CreateTrafficLightRequest {
  string address = 1;
  string type = 2;
  int32 year_installation = 3;
}

message CreateTrafficLightResponse {
  TrafficLight traffic_light = 1;
}

message GetTrafficLightRequest {
  int64 id = 1;
}

message GetTrafficLightResponse {
  TrafficLight traffic_light = 1;
}

message UpdateTrafficLightRequest {
  int64 id = 1;
  string address = 2;
  string type = 3;
  int32 year_installation = 4;
}

message UpdateTrafficLightResponse {
  TrafficLight traffic_light = 1;
}

message DeleteTrafficLightRequest {
  int64 id = 1;
}

message DeleteTrafficLightResponse {
  bool success = 1;
}

message ListTrafficLightsRequest {

}

message ListTrafficLightsResponse {
  repeated TrafficLight traffic_lights = 1;
}


